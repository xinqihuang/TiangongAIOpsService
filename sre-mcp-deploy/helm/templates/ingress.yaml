{{- $ports := dict "rca" 8001 "monitor" 8002 "remediation" 8003 }}
{{- range $module := list "rca" "monitor" "remediation" }}
{{- $mod := index $.Values $module }}
{{- if and $mod.enabled $mod.ingress.enabled }}
{{- $port := index $ports $module }}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ printf "sre-mcp-%s" $module }}
  namespace: {{ $.Values.global.namespace }}
  labels:
    {{- include "sre-mcp.labels" $ | nindent 4 }}
    {{- include "sre-mcp.selectorLabels" (dict "module" $module) | nindent 4 }}
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "300"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "300"
    {{- with $mod.ingress.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  {{- if $mod.ingress.className }}
  ingressClassName: {{ $mod.ingress.className }}
  {{- end }}
  {{- if $mod.ingress.tls }}
  tls:
    {{- toYaml $mod.ingress.tls | nindent 4 }}
  {{- end }}
  rules:
    - host: {{ $mod.ingress.host }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ printf "sre-mcp-%s" $module }}
                port:
                  name: http
{{- end }}
{{- end }}
