{{/*
Sensitive credentials are stored in a single Secret per module.
In production, prefer ExternalSecret (ESO) pulling from KMS rather than
storing plaintext values in Helm values — set global.useExternalSecrets=true
to skip this template.
*/}}
{{- if not $.Values.global.useExternalSecrets }}
{{- range $module := list "rca" "monitor" "remediation" }}
{{- $mod := index $.Values $module }}
{{- if $mod.enabled }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ printf "sre-mcp-%s-secret" $module }}
  namespace: {{ $.Values.global.namespace }}
  labels:
    {{- include "sre-mcp.labels" $ | nindent 4 }}
    {{- include "sre-mcp.selectorLabels" (dict "module" $module) | nindent 4 }}
type: Opaque
stringData:
  HW_AK: {{ $.Values.global.huaweicloud.ak | quote }}
  HW_SK: {{ $.Values.global.huaweicloud.sk | quote }}
  REDIS_PASSWORD: {{ $.Values.global.redis.password | quote }}
  PG_PASSWORD: {{ $.Values.global.postgres.password | quote }}
  VLLM_API_KEY: {{ $.Values.global.vllm.apiKey | quote }}
  {{- if eq $module "rca" }}
  NEO4J_PASSWORD: {{ $mod.neo4j.password | quote }}
  {{- end }}
{{- end }}
{{- end }}
{{- end }}
