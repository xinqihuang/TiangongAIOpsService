name: CD — Build Image & Deploy

on:
  push:
    branches: [main, master]
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      environment:
        description: "Target environment (dev / prod)"
        required: true
        default: dev
        type: choice
        options: [dev, prod]
      image_tag:
        description: "Image tag (default: git SHA)"
        required: false

env:
  SWR_REGISTRY: swr.cn-north-4.myhuaweicloud.com
  SWR_ORGANIZATION: sre-mcp
  IMAGE_TAG: ${{ github.event.inputs.image_tag || github.sha }}

jobs:
  build-images:
    name: Build & Push Images to SWR
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: temurin
          cache: maven

      - name: Log in to HuaweiCloud SWR
        run: |
          docker login \
            -u "${{ secrets.SWR_REGION }}@${{ secrets.SWR_AK }}" \
            -p "${{ secrets.SWR_LOGIN_KEY }}" \
            ${{ env.SWR_REGISTRY }}

      - name: Build and push sre-mcp-rca image
        run: |
          mvn spring-boot:build-image \
            -pl sre-mcp-rca -am \
            -DskipTests \
            -B --no-transfer-progress \
            -Dswr.registry=${{ env.SWR_REGISTRY }}/${{ env.SWR_ORGANIZATION }} \
            -Dspring-boot.build-image.imageName=${{ env.SWR_REGISTRY }}/${{ env.SWR_ORGANIZATION }}/sre-mcp-rca:${{ env.IMAGE_TAG }}
          docker push ${{ env.SWR_REGISTRY }}/${{ env.SWR_ORGANIZATION }}/sre-mcp-rca:${{ env.IMAGE_TAG }}

      - name: Build and push sre-mcp-monitor image
        run: |
          mvn spring-boot:build-image \
            -pl sre-mcp-monitor -am \
            -DskipTests \
            -B --no-transfer-progress \
            -Dswr.registry=${{ env.SWR_REGISTRY }}/${{ env.SWR_ORGANIZATION }} \
            -Dspring-boot.build-image.imageName=${{ env.SWR_REGISTRY }}/${{ env.SWR_ORGANIZATION }}/sre-mcp-monitor:${{ env.IMAGE_TAG }}
          docker push ${{ env.SWR_REGISTRY }}/${{ env.SWR_ORGANIZATION }}/sre-mcp-monitor:${{ env.IMAGE_TAG }}

      - name: Build and push sre-mcp-remediation image
        run: |
          mvn spring-boot:build-image \
            -pl sre-mcp-remediation -am \
            -DskipTests \
            -B --no-transfer-progress \
            -Dswr.registry=${{ env.SWR_REGISTRY }}/${{ env.SWR_ORGANIZATION }} \
            -Dspring-boot.build-image.imageName=${{ env.SWR_REGISTRY }}/${{ env.SWR_ORGANIZATION }}/sre-mcp-remediation:${{ env.IMAGE_TAG }}
          docker push ${{ env.SWR_REGISTRY }}/${{ env.SWR_ORGANIZATION }}/sre-mcp-remediation:${{ env.IMAGE_TAG }}

      - name: Tag as latest (main branch only)
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        run: |
          for module in rca monitor remediation; do
            docker tag \
              ${{ env.SWR_REGISTRY }}/${{ env.SWR_ORGANIZATION }}/sre-mcp-${module}:${{ env.IMAGE_TAG }} \
              ${{ env.SWR_REGISTRY }}/${{ env.SWR_ORGANIZATION }}/sre-mcp-${module}:latest
            docker push ${{ env.SWR_REGISTRY }}/${{ env.SWR_ORGANIZATION }}/sre-mcp-${module}:latest
          done

  deploy-dev:
    name: Deploy to Dev
    needs: build-images
    runs-on: ubuntu-22.04
    environment: dev
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || github.event.inputs.environment == 'dev'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.16.0

      - name: Set up kubectl (CCE)
        run: |
          echo "${{ secrets.KUBECONFIG_DEV }}" | base64 -d > kubeconfig.yaml
          echo "KUBECONFIG=$(pwd)/kubeconfig.yaml" >> $GITHUB_ENV

      - name: Create namespace if not exists
        run: kubectl create namespace sre-mcp-dev --dry-run=client -o yaml | kubectl apply -f -

      - name: Create SWR pull secret
        run: |
          kubectl create secret docker-registry swr-secret \
            --docker-server=${{ env.SWR_REGISTRY }} \
            --docker-username="${{ secrets.SWR_REGION }}@${{ secrets.SWR_AK }}" \
            --docker-password="${{ secrets.SWR_LOGIN_KEY }}" \
            --namespace sre-mcp-dev \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Helm deploy (dev)
        run: |
          helm upgrade --install sre-mcp sre-mcp-deploy/helm/ \
            --namespace sre-mcp-dev \
            --create-namespace \
            -f sre-mcp-deploy/helm/values-dev.yaml \
            --set rca.image.tag=${{ env.IMAGE_TAG }} \
            --set monitor.image.tag=${{ env.IMAGE_TAG }} \
            --set remediation.image.tag=${{ env.IMAGE_TAG }} \
            --set global.huaweicloud.ak=${{ secrets.HW_AK }} \
            --set global.huaweicloud.sk=${{ secrets.HW_SK }} \
            --set global.huaweicloud.projectId=${{ secrets.HW_PROJECT_ID }} \
            --wait --timeout 5m

      - name: Verify deployment
        run: |
          kubectl rollout status deployment/sre-mcp-rca -n sre-mcp-dev --timeout=3m
          kubectl rollout status deployment/sre-mcp-monitor -n sre-mcp-dev --timeout=3m
          kubectl rollout status deployment/sre-mcp-remediation -n sre-mcp-dev --timeout=3m

  deploy-prod:
    name: Deploy to Production
    needs: build-images
    runs-on: ubuntu-22.04
    environment: prod
    if: startsWith(github.ref, 'refs/tags/v') || github.event.inputs.environment == 'prod'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.16.0

      - name: Set up kubectl (CCE prod)
        run: |
          echo "${{ secrets.KUBECONFIG_PROD }}" | base64 -d > kubeconfig.yaml
          echo "KUBECONFIG=$(pwd)/kubeconfig.yaml" >> $GITHUB_ENV

      - name: Helm deploy (prod)
        run: |
          helm upgrade --install sre-mcp sre-mcp-deploy/helm/ \
            --namespace sre-mcp \
            --create-namespace \
            -f sre-mcp-deploy/helm/values-prod.yaml \
            --set rca.image.tag=${{ env.IMAGE_TAG }} \
            --set monitor.image.tag=${{ env.IMAGE_TAG }} \
            --set remediation.image.tag=${{ env.IMAGE_TAG }} \
            --set global.huaweicloud.projectId=${{ secrets.HW_PROJECT_ID_PROD }} \
            --set global.postgres.host=${{ secrets.PG_HOST_PROD }} \
            --set global.kafka.bootstrapServers=${{ secrets.KAFKA_BROKERS_PROD }} \
            --set global.vllm.endpoint=${{ secrets.VLLM_ENDPOINT_PROD }} \
            --wait --timeout 10m

      - name: Verify production deployment
        run: |
          kubectl rollout status deployment/sre-mcp-rca -n sre-mcp --timeout=5m
          kubectl rollout status deployment/sre-mcp-monitor -n sre-mcp --timeout=5m
          kubectl rollout status deployment/sre-mcp-remediation -n sre-mcp --timeout=5m
