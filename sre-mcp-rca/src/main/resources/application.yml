server:
  port: 8001

spring:
  application:
    name: sre-mcp-rca
  threads:
    virtual:
      enabled: true

  # JPA / PostgreSQL
  datasource:
    url: jdbc:postgresql://${PG_HOST:localhost}:5432/${PG_DB:sre_mcp}
    username: ${PG_USER:sre}
    password: ${PG_PASSWORD:dev}
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 10000
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: false

  # Redis
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      lettuce:
        pool:
          max-active: 20
          min-idle: 5

  # Spring AI — vLLM (OpenAI-compatible)
  ai:
    openai:
      base-url: ${VLLM_ENDPOINT:http://localhost:8000}
      api-key: ${VLLM_API_KEY:not-needed}
      chat:
        options:
          model: ${VLLM_MODEL:Qwen2.5-72B-Instruct}
          temperature: 0.1
          max-tokens: 4096
      embedding:
        options:
          model: ${VLLM_EMBED_MODEL:Qwen2.5-72B-Instruct}
    mcp:
      server:
        name: sre-mcp-rca
        version: "0.1.0"

# Huawei Cloud
huaweicloud:
  region: ${HW_REGION:cn-north-4}
  project-id: ${HW_PROJECT_ID:}
  ak: ${HW_AK:}
  sk: ${HW_SK:}

# Neo4j
neo4j:
  uri: ${NEO4J_URI:bolt://localhost:7687}
  authentication:
    username: ${NEO4J_USER:neo4j}
    password: ${NEO4J_PASSWORD:devpassword}
  pool:
    max-connection-pool-size: 50
  connection-timeout: 5000

# Resilience4j
resilience4j:
  retry:
    instances:
      huaweicloud-api:
        max-attempts: 3
        wait-duration: 1s
        retry-exceptions:
          - com.huawei.cloud.sre.common.exception.HuaweiCloudException
      neo4j:
        max-attempts: 3
        wait-duration: 500ms
  circuitbreaker:
    instances:
      huaweicloud-api:
        sliding-window-size: 10
        failure-rate-threshold: 50
        wait-duration-in-open-state: 30s
        permitted-number-of-calls-in-half-open-state: 5
      neo4j:
        sliding-window-size: 10
        failure-rate-threshold: 60
        wait-duration-in-open-state: 10s

# Actuator
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always
  metrics:
    export:
      prometheus:
        enabled: true

# Logging
logging:
  level:
    com.huawei.cloud.sre: INFO
    org.springframework.ai: WARN
    org.neo4j.driver: WARN
