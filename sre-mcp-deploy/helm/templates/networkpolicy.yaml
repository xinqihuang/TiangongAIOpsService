{{- $ports := dict "rca" 8001 "monitor" 8002 "remediation" 8003 }}
{{- range $module := list "rca" "monitor" "remediation" }}
{{- $mod := index $.Values $module }}
{{- if $mod.enabled }}
{{- $port := index $ports $module }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ printf "sre-mcp-%s" $module }}
  namespace: {{ $.Values.global.namespace }}
  labels:
    {{- include "sre-mcp.labels" $ | nindent 4 }}
    {{- include "sre-mcp.selectorLabels" (dict "module" $module) | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "sre-mcp.selectorLabels" (dict "module" $module) | nindent 6 }}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # Allow traffic from Ingress controller
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
      ports:
        - port: {{ $port }}
          protocol: TCP
    # Allow Prometheus scraping
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
      ports:
        - port: {{ $port }}
          protocol: TCP
    # Allow inter-service calls within the same namespace (e.g., Agent orchestrator)
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ $.Values.global.namespace }}
      ports:
        - port: {{ $port }}
          protocol: TCP
  egress:
    # Allow DNS
    - ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
    # Allow access to PostgreSQL
    - ports:
        - port: 5432
          protocol: TCP
    # Allow access to Redis
    - ports:
        - port: 6379
          protocol: TCP
        - port: 6380
          protocol: TCP
    # Allow access to Kafka
    - ports:
        - port: 9092
          protocol: TCP
        - port: 9093
          protocol: TCP
    # Allow HTTPS calls to HuaweiCloud APIs and vLLM
    - ports:
        - port: 443
          protocol: TCP
        - port: 8000
          protocol: TCP
{{- end }}
{{- end }}
